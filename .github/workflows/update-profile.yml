name: Update FIT Profile

on:
  schedule:
    - cron: '30 6 * * 0' # weekly on Sunday at 06:30 UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl requests

      - name: Download latest profiles
        run: python extraction/download_profiles.py extraction/

      - name: Build profile.json
        run: |
          python extraction/build_profile.py \
            extraction/Profile_Official.xlsx \
            extraction/Profile_Community.xlsx \
            profile.json

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet profile.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add profile.json
          git commit -m "chore: update FIT profile.json"
          git push
